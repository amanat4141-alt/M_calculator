<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <title>Login • Euro Calculator</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body class="login-body theme-green">

  <div class="login-wrap">
    <div class="login-card-new">

      <div class="login-logo-new"><i class="bi bi-shield-lock-fill"></i></div>

      <h1 class="login-title-new">Welcome Back</h1>
      <p class="login-subtitle-new">Euro Calculator-এ ঢুকতে Login করুন</p>

      <label class="app-label">Username</label>
      <div class="login-field" id="usernameField">
        <i class="bi bi-person"></i>
        <input id="username" type="text" placeholder="Username লিখুন"
          autocomplete="username" autocapitalize="off" autocorrect="off"
          spellcheck="false">
      </div>

      <label class="app-label" style="margin-top:14px;">Password</label>
      <div class="login-field" id="passwordField">
        <i class="bi bi-lock"></i>
        <input id="password" type="password" placeholder="Password লিখুন"
          autocomplete="current-password">
        <button class="toggle-pwd" id="togglePassword" type="button">
          <i class="bi bi-eye"></i>
        </button>
      </div>

      <div class="login-err" id="loginError"></div>

      <button class="login-btn-new" id="loginBtn" type="button">Login
        করুন</button>

      <p class="login-hint-new">Admin অথবা User — যেকোনো একটা দিয়ে ঢুকুন</p>

    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="auth.js"></script>
  <script>
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const usernameField = document.getElementById("usernameField");
    const passwordField = document.getElementById("passwordField");
    const toggleBtn = document.getElementById("togglePassword");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("loginError");

    if (isAuthed()) window.location.href = "index.html";

    toggleBtn.addEventListener("click", function() {
      const isPwd = passwordInput.type === "password";
      passwordInput.type = isPwd ? "text" : "password";
      toggleBtn.innerHTML = isPwd ? '<i class="bi bi-eye-slash"></i>' :
        '<i class="bi bi-eye"></i>';
    });

    function attemptLogin() {
      const u = usernameInput.value.trim();
      const p = passwordInput.value.trim();
      if (!u || !p) return showError("Username এবং Password দুটোই দিন");

      const r = login(u, p);
      if (r.ok) {
        loginBtn.textContent = "✅ সফল! ঢুকছি...";
        loginBtn.disabled = true;
        setTimeout(() => window.location.href = "index.html", 500);
      } else {
        showError(r.error || "ভুল Username বা Password");
      }
    }

    function showError(msg) {
      errorBox.textContent = "❌ " + msg;
      errorBox.classList.add("show");
      usernameField.classList.add("error");
      passwordField.classList.add("error");
      passwordInput.value = "";
      setTimeout(() => {
        usernameField.classList.remove("error");
        passwordField.classList.remove("error");
      }, 600);
    }

    loginBtn.addEventListener("click", attemptLogin);

    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          attemptLogin();
        }
      });
      input.addEventListener("input", () => {
        errorBox.classList.remove("show");
        usernameField.classList.remove("error");
        passwordField.classList.remove("error");
      });
    });
  </script>

</body>

</html>
