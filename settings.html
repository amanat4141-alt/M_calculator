<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10b981">
  <title>Settings • Account</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body class="theme-green">

  <nav class="app-nav">
    <div class="app-nav-inner">
      <a href="index.html" class="app-nav-brand">
        <div class="app-nav-brand-icon"><i class="bi bi-person-gear"></i></div>
        <div class="app-nav-brand-text">
          <strong>Settings</strong>
          <span>Account পরিবর্তন</span>
        </div>
      </a>

      <div class="nav-right">
        <div class="dropdown">
          <button class="user-btn-compact" data-bs-toggle="dropdown"
            aria-expanded="false">
            <div class="user-avatar" id="userAvatar">U</div>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li class="dropdown-header">
              <div class="dh-label">Signed in as</div>
              <div class="dh-name">
                <span id="ddUserName">User</span>
                <span class="dh-badge" id="ddRole">User</span>
              </div>
            </li>
            <li><a class="dropdown-item" href="admin.html" id="adminLink"
                style="display:none;"><i class="bi bi-sliders"></i> Admin
                Panel</a></li>
            <li><a class="dropdown-item" href="settings.html"><i
                  class="bi bi-key"></i> Account</a></li>
            <li><a class="dropdown-item danger" href="#"
                onclick="logout(); return false;"><i
                  class="bi bi-box-arrow-right"></i> Logout</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="app-main">
    <div class="container-app">

      <div class="nav-btn-box">
        <a href="second.html" class="nav-btn btn-green"><i
            class="bi bi-currency-euro"></i><span>Euro-BD</span></a>
        <a href="index.html" class="nav-btn btn-blue"><i
            class="bi bi-calculator"></i><span>Euro Calc</span></a>
        <a href="bkash.html" class="nav-btn btn-pink"><i
            class="bi bi-phone"></i><span>bKash</span></a>
      </div>

      <div class="app-card">
        <div class="app-card-title">
          <div class="app-card-icon"><i class="bi bi-person-gear"></i></div>
          <div><strong>Account পরিবর্তন</strong><small>Username ও Password
              বদলান</small></div>
        </div>

        <div
          style="background:var(--brand-soft); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;">
          <div
            style="font-size:10.5px; font-weight:700; color:var(--ink-4); text-transform:uppercase; letter-spacing:1.4px; margin-bottom:5px;">
            Current Account</div>
          <div style="display:flex; align-items:center; gap:8px;">
            <i class="bi bi-person-circle"
              style="font-size:18px; color:var(--brand-dark);"></i>
            <span id="currentUsername"
              style="font-family:'JetBrains Mono', monospace; font-size:15px; font-weight:700; color:var(--brand-dark);">—</span>
            <span id="currentRole" class="dh-badge"
              style="font-size:10px; padding:2px 8px; border-radius:999px; background:var(--brand); color:#fff; font-weight:700; text-transform:uppercase;">User</span>
          </div>
        </div>

        <label class="app-label" for="oldPwd">পুরোনো Password <span
            style="color:var(--rose);">*</span></label>
        <div class="app-input" style="margin-bottom:14px;">
          <i class="bi bi-lock" style="font-size:16px;color:var(--ink-4);"></i>
          <input id="oldPwd" type="password" placeholder="পুরোনো password"
            autocomplete="current-password">
        </div>

        <label class="app-label" for="newUsername">নতুন Username <span
            style="color:var(--ink-4); font-weight:500; text-transform:none; letter-spacing:0;">(ফাঁকা
            রাখলে একই থাকবে)</span></label>
        <div class="app-input" style="margin-bottom:14px;">
          <i class="bi bi-person"
            style="font-size:16px;color:var(--ink-4);"></i>
          <input id="newUsername" type="text" placeholder="নতুন username"
            autocapitalize="off" spellcheck="false">
        </div>

        <label class="app-label" for="newPwd">নতুন Password <span
            style="color:var(--ink-4); font-weight:500; text-transform:none; letter-spacing:0;">(ফাঁকা
            রাখলে একই থাকবে)</span></label>
        <div class="app-input" style="margin-bottom:14px;">
          <i class="bi bi-shield-lock"
            style="font-size:16px;color:var(--ink-4);"></i>
          <input id="newPwd" type="password" placeholder="কমপক্ষে ৪ অক্ষর"
            autocomplete="new-password">
        </div>

        <label class="app-label" for="confirmPwd">নতুন Password (আবার)</label>
        <div class="app-input">
          <i class="bi bi-shield-check"
            style="font-size:16px;color:var(--ink-4);"></i>
          <input id="confirmPwd" type="password" placeholder="আবার লিখুন"
            autocomplete="new-password">
        </div>

        <div id="pwdMsg" class="login-err"></div>

        <button class="app-btn primary" onclick="handleSave()">
          <i class="bi bi-check-circle"></i>
          <span>পরিবর্তন সেভ করুন</span>
        </button>
      </div>

      <div class="info-tip">
        <i class="bi bi-lightbulb-fill"></i>
        <p>শুধু যা বদলাতে চান সেটাই লিখুন। খালি রাখলে আগেরটাই থাকবে।</p>
      </div>

      <footer class="app-footer">
        <strong>Settings</strong>
        <span>Secure • Simple</span>
      </footer>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="auth.js"></script>
  <script>
    if (typeof checkAuth === "function") checkAuth();

    const user = getCurrentUser();
    if (user) {
      document.getElementById("userAvatar").textContent = user.username.charAt(
        0).toUpperCase();
      document.getElementById("ddUserName").textContent = user.username;
      document.getElementById("currentUsername").textContent = user.username;

      if (user.isAdmin) {
        document.getElementById("ddRole").textContent = "Admin";
        document.getElementById("currentRole").textContent = "Admin";
        document.getElementById("adminLink").style.display = "flex";
      }
    }

    const oldPwd = document.getElementById("oldPwd");
    const newUsername = document.getElementById("newUsername");
    const newPwd = document.getElementById("newPwd");
    const confirmPwd = document.getElementById("confirmPwd");
    const pwdMsg = document.getElementById("pwdMsg");

    function handleSave() {
      const oldVal = oldPwd.value.trim();
      const newUserVal = newUsername.value.trim();
      const newPwdVal = newPwd.value.trim();
      const confirmVal = confirmPwd.value.trim();

      if (!oldVal) return showMsg("❌ পুরোনো Password দিন", "error");
      if (!newUserVal && !newPwdVal) return showMsg(
        "❌ নতুন Username বা Password যেকোনো একটা লিখুন", "error");
      if (newPwdVal && newPwdVal !== confirmVal) return showMsg(
        "❌ নতুন Password দুটো মিলছে না", "error");

      const result = changeOwnCredentials(oldVal, newUserVal, newPwdVal);

      if (result.ok) {
        showMsg("✅ " + result.message, "success");
        oldPwd.value = "";
        newUsername.value = "";
        newPwd.value = "";
        confirmPwd.value = "";
        setTimeout(function() {
          window.location.href = "index.html";
        }, 1300);
      } else {
        showMsg("❌ " + result.error, "error");
      }
    }

    function showMsg(text, type) {
      pwdMsg.textContent = text;
      pwdMsg.classList.add("show");

      if (type === "success") {
        pwdMsg.style.background = "#ecfdf5";
        pwdMsg.style.color = "#047857";
        pwdMsg.style.borderColor = "#a7f3d0";
      } else {
        pwdMsg.style.background = "#fff1f2";
        pwdMsg.style.color = "#991b1b";
        pwdMsg.style.borderColor = "#fecaca";
      }

      setTimeout(function() {
        pwdMsg.classList.remove("show");
      }, 4000);
    }

    [oldPwd, newUsername, newPwd, confirmPwd].forEach(function(input) {
      input.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSave();
        }
      });
      input.addEventListener("input", function() {
        pwdMsg.classList.remove("show");
      });
    });
  </script>

</body>

</html>
